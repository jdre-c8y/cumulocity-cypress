# c8y-cygen conventions for Cumulocity-IoT/cumulocity-ui.
#
# Reviewed and committed. This is the artifact that belongs in the target repo; it lives here
# so that the slice is self-contained, and `--conventions <path>` points a run at it. Copy it
# to the target repo root as `c8y-cygen.conventions.yaml` when a human has signed it off there.
#
# Its companion, the reachability index, is a *cache* and is not reviewed: a stale entry there
# costs one probe run and self-corrects, where a stale entry here ships.
#
# Every count below is what the scout miner measures over the spec tree, not an estimate and not
# a repo-wide grep - so staleness detection is exactly "re-run the miner and diff the mined
# half". Counts are what makes a field reviewable: a human can disagree with "933 uses" in a way
# they cannot disagree with "preferred".

schemaVersion: 1
repo: cumulocity-ui
kind: app
testDataPrefix: e2e

# ---------------------------------------------------------------------------
# provenance - this block IS the staleness check: re-mine and diff
# ---------------------------------------------------------------------------
minedFrom:
  supportFile: cypress/support/e2e.ts
  cypressConfig: cypress.config.ts
  library:
    name: cumulocity-cypress
    resolved: 1.1.5
  corpus:
    specFiles: 200
    directories: 10
  registryProbe:
    cypressVersion: 15.8.1
    callableWithSupportFile: 236
    callableOnStockCypress: 181
    registeredByThisRepo: 55

# ---------------------------------------------------------------------------
# placement - the spec lands beside its scenario contract, so this records the tree
# rather than deriving a directory from a scenario. Nothing can: the top-level directory
# is a TEAM, and no rule gets "dataAndControlTeam" out of a scenario about events.
# Choosing the directory also chooses the grep tag.
# ---------------------------------------------------------------------------
placement:
  specRoot: cypress/e2e
  suffix: .cy.ts
  # Re-mined 2026-09-11, after this table stopped being documentation and became the source of
  # every emitted describe tag. Two entries were wrong and are corrected here: `authentication`
  # read '@requiresBackend' (an it-level tag) where all 25 of its describes say '@authentication',
  # and `lwm2mOpcuaTeam` read the same where its describes carry the two team tags. Both came
  # from a miner that took the first `tags:` anywhere in the first file it walked; it now anchors
  # on `describe(` and takes the tagging most of a directory's describes agree on.
  #
  # A tag here goes into every spec generated for that directory, and a wrong one puts the spec
  # in a CI lane nobody greps - a failure no assertion inside the spec can catch. Diff this block
  # against a fresh `cygen scout` before trusting it.
  directories:
    appEnablementTeam: { specs: 49, tag: '@appEnablementTeam' }
    authentication: { specs: 25, tag: '@authentication' }
    dataAndControlTeam:
      specs: 42
      tag: ['@deviceManagementTeam', '@dataAndControlTeam']
    documentation-screenshots: { specs: 46, tag: null }
    lpwanIntegrationTeam:
      specs: 8
      tag: ['@deviceManagementTeam', '@lpwanIntegrationTeam']
    lwm2mOpcuaTeam:
      specs: 3
      tag: ['@deviceManagementTeam', '@lwm2mOpcuaTeam']
    platformTeam: { specs: 29, tag: '@platformTeam' }

# ---------------------------------------------------------------------------
# formatter - there is no quote field and no indent field here on purpose.
# A quote *preference* emits cy.get("[data-cy="..."]"), which does not parse. Prettier
# already implements the rule that finding demanded - flip the quote when the content would
# need escaping - and it reads config this repo already maintains.
# ---------------------------------------------------------------------------
formatter:
  run: ['node_modules/.bin/prettier', '--write', '{file}']
  cwd: '.' # repo root: prettier resolves config per FILE PATH, not per repo
  configFound: .prettierrc.yaml # singleQuote: true, printWidth: 100, trailingComma: none

commands:
  # (1) AVAILABLE - every command registered once the support file has loaded.
  # GENERATED by the enumeration probe. Not reviewed line by line. The linter checks every
  # callRepoHelper name against this list, which is why it must be complete.
  #
  # A grep cannot produce it. cy.verifyDownload (14 uses) arrives through
  #   require('cy-verify-downloads').addCustomCommand()      - support/e2e.ts:25
  # with no Cypress.Commands.add anywhere in the repo.
  available:
    source: probe
    generated: true
    # MEASURED, not transcribed: two probe runs against the tenant, one with the support file
    # and one with supportFile:false, and the difference between what is callable on `cy` in
    # each. 236 callable with the support file, 181 on a stock cy, so 55 are this repo's.
    #
    # A grep cannot produce this. cy.verifyDownload arrives through
    #   require('cy-verify-downloads').addCustomCommand()      - support/e2e.ts:25
    # with no Cypress.Commands.add anywhere in the repo, and six more come from loop-registered
    # third-party packages the same way.
    names:
      - acceptCookieBanner
      - assignUserRoles
      - attachFile
      - bootstrapDeviceCredentials
      - c8yclient
      - c8yclientf
      - c8ymatch
      - checkA11y
      - clearHighlights
      - clearLocalStorageSnapshot
      - clearUserRoles
      - compareDates
      - compareSnapshot
      - configureAxe
      - createDevice
      - createGlobalRole
      - createMockedDevice
      - createTenant
      - createUser
      - dateFormat
      - deleteGlobalRoles
      - deleteUser
      - disableCookieBanner
      - disableGainsight
      - disableLocalStorage
      - displayCookieBanner
      - documentationScreenshotViewport
      - getAuth
      - getCurrentTenant
      - getDeviceIdByName
      - getLocalStorage
      - getShellVersion
      - getSystemVersion
      - getTenantId
      - hideCookieBanner
      - hidePopover
      - highlight
      - injectAxe
      - login
      - mockMOsPerCurrentPage
      - openRegistrationForm
      - removeLocalStorage
      - restoreLocalStorage
      - saveLocalStorage
      - setLanguage
      - setLocalStorage
      - showCookieBanner
      - toDate
      - toISODate
      - useAuth
      - verifyDownload
      - visitAndVerifyContentByText
      - visitAndWaitForSelector
      - visitAndWaitUntilPageLoad
      - visitInfoPageAndWaitForWidgetsToLoad
      # A Cypress built-in this repo OVERWRITES (commands.ts:316) to attach X-XSRF-TOKEN, so it
      # does not appear in the registered diff but is real and callable. There is a `request`
      # verb for it; naming it as a repo helper is real-but-unblessed, which is the right answer.
      - request

    # Registered twice. cypress/support/commands.ts loads after the library barrel, so the
    # repo signature wins - and the signatures are NOT compatible, so a scout that merges two
    # grepped lists emits the wrong arity.
    collisions:
      - name: login
        winner: repo
        repoSignature: login(username, password, acceptCookieBanner?, blockGainsight?)
        librarySignature: login(user, password, options?)
      - name: acceptCookieBanner
        winner: repo
      - name: getTenantId
        winner: repo
      - name: request
        winner: repo # over the Cypress built-in, to attach X-XSRF-TOKEN

    # Names that look real and are not. Recorded so the two known mistakes cannot repeat.
    knownPhantoms:
      - name: visitAndWaitToFinishLoading
        why: a stale @example in cumulocity-cypress@1.1.5's own .d.ts; the command was renamed
        realName: visitAndWaitForSelector
      - name: postEvent
        why: invented by a model authoring B0; the oracle uses cy.request('/event/events', 'POST')

  # (2) BLESSED - what a generated spec MAY use. The safety boundary. Human-reviewed.
  blessed:
    - name: login
      binding: global
      signature: "login(username, password, acceptCookieBanner = true, blockGainsight = true)" # read off the registration site
      kind: real-state
      role: auth
      uses: 232
      callShape: "cy.login(Cypress.env('username'), Cypress.env('password'))"
    - name: visitAndWaitUntilPageLoad
      binding: global
      signature: "visitAndWaitUntilPageLoad(url, doA11yCheck = true, selector?)" # read off the registration site
      kind: neither
      role: navigate
      uses: 933
    - name: createDevice
      binding: global
      signature: "createDevice(deviceProperties = { name: 'e2eDevice' })" # read off the registration site
      kind: real-state
      role: setup
      uses: 60
      returns: the created managed object
      # There is no cy.deleteDevice in this repo. The house teardown is a cascade delete of the
      # managed object, written by hand. Recorded rather than papered over.
      pairsWith: null
      teardown: inventoryCascadeDelete
    - name: getDeviceIdByName
      binding: global
      signature: "getDeviceIdByName(deviceName, isDeviceSimulator?)" # read off the registration site
      kind: real-state # read-only
      role: setup
      uses: 21
    - name: createMockedDevice
      binding: global
      signature: "createMockedDevice(moProperties: { id: '' })" # read off the registration site
      kind: fabricating # cy.intercept + req.reply, commands.ts:360
      role: setup
      uses: 49
      # Synthesises self: 'https://someTenant.stage.c8y.io/...', a hostname no real tenant
      # returns. Fabrication is legal only through a blessed helper, which is exactly why this
      # is listed here rather than left for a model to reinvent.
      fabricates: [self, creationTime, lastUpdated]
      pairsWith: null
    - name: mockMOsPerCurrentPage
      binding: global
      signature: "mockMOsPerCurrentPage(managedObjects, pageSize?)" # read off the registration site
      kind: fabricating
      role: setup
      uses: 29
      pairsWith: null

  # Real, safe, and never written by a human here. Emitting one produces a spec that is correct
  # and visibly foreign, which fails the house-style axis. Left unblessed deliberately: this is
  # the whole reason available, blessed and idiomatic are three sets and not one.
  withheld:
    - names:
        - assignUserRoles
        - c8yclient
        - c8yclientf
        - clearUserRoles
        - createGlobalRole
        - createUser
        - deleteGlobalRoles
        - deleteUser
        - getAuth
        - getCurrentTenant
        - setLanguage
        - useAuth
      uses: 0
      why: registered by cumulocity-cypress but zero call sites across 200 specs

  # (3) IDIOMATIC - what humans actually write. House style only, never a safety input.
  idiomatic:
    auth: "cy.login(Cypress.env('username'), Cypress.env('password'))"
    # The second argument is the a11y switch. It is `false` at every call site that passes one
    # and `true` at none. Omitting it is legal and wrong: the default is true, which silently
    # turns on cy.checkA11y inside the navigation command.
    navigate: 'cy.visitAndWaitUntilPageLoad({path}, false)'

# ---------------------------------------------------------------------------
# apiSetup - which raw-API idiom this repo uses. Whichever of the two a repo prefers is a
# conventions fact, not a safety fact; the safety property is anchoring, and it applies to both.
# ---------------------------------------------------------------------------
apiSetup:
  prefer: request
  counts: { 'cy.request': 90, 'cy.c8yclient': 0, 'cy.c8yclientf': 0 }
  # cy.request is OVERWRITTEN here (commands.ts:316) to attach X-XSRF-TOKEN. A generated spec
  # gets that for free and must not re-implement it.
  requestIsOverwritten: true
  callShape: 'cy.request({url}, {method}, {body})'

# ---------------------------------------------------------------------------
# valueBuilders - seeded from the corpus, not minimal. A short list fires assist constantly,
# which is the adoption failure where a teammate whose first scenario stops three times
# concludes the tool does not work.
# ---------------------------------------------------------------------------
valueBuilders:
  - id: now
    emit: 'Cypress._.now()'
    uses: 174
  - id: uniqueName
    emit: '`{prefix}${Cypress._.now()}`'
    uses: 91
    prefixConvention: e2e
  - id: isoTime
    emit: "dayjs().format('YYYY-MM-DDTHH:mm:ssZ')"
    uses: 311 # dayjs( across the spec tree; this format string is its dominant use
  - id: isoTimeUtc
    emit: 'dayjs().toISOString()'
    uses: 28
  - id: envValue
    emit: "Cypress.env('{key}')"
    uses: 608
    # KEY NAMES ONLY. cypress.env.json in this repo holds live credentials and is committed;
    # the scout must never copy env values.
    keys:
      - username
      - password
      - tenantId
      - admin_username
      - admin_password
      - C8Y_BASEURL
      - C8Y_PACT_MODE

# ---------------------------------------------------------------------------
# idioms - call shapes the compiler emits. Not formatting; prettier owns that.
# ---------------------------------------------------------------------------
idioms:
  describeOptions: '{ tags: {tag} }'
  beforeEach:
    - "cy.login(Cypress.env('username'), Cypress.env('password'))"
  # What a withinMinutesOfNow comparator needs in scope. It is a repo fact - which dayjs, and
  # how the utc plugin is registered here - so it is not hardcoded in the compiler.
  timePreamble:
    - "import * as dayjs from 'dayjs';"
    - "import utc from 'dayjs/plugin/utc';"
    - ''
    - 'dayjs.extend(utc);'
  teardown:
    style: manual
    # Honest reading of the corpus: only 27 of 200 spec files have any afterEach, and 7 create
    # real devices with no DELETE at all. A generated spec that resets what it created looks
    # MORE hygienic than its neighbours. The first scored run raised that as a grading question
    # rather than pre-deciding it, and it was settled on 2026-09-11 in favour of ticket 02
    # Q7(c): the spec resets what it created, per it(), and nothing else. A blessed move names
    # its snippet below with a `teardown:` key; a move with no key is one this repo cannot undo,
    # and nothing is emitted for it.
    inventoryCascadeDelete: |
      cy.request({
        url: `/inventory/managedObjects/${id}?cascade=true`,
        method: 'DELETE',
        failOnStatusCode: false
      });
    corpusCoverage: { filesWithAfterEach: 27, ofFiles: 200 }

# ---------------------------------------------------------------------------
# runtime - recorded, not obeyed. Scoring forces retries to zero whatever this says.
# ---------------------------------------------------------------------------
runtime:
  viewport: { width: 1920, height: 1080 }
  defaultCommandTimeout: 10000
  retries: { runMode: 2, openMode: 0 }
  generatedSpecMustPassWithoutRetries: true

overrides:
  - match: cypress/e2e/documentation-screenshots/**
    why: >
      A different genre in the same repo: mock-driven screenshot capture, not assertion. All 46
      files call cy.documentationScreenshotViewport() and no file outside this directory calls
      it once, which is a perfect discriminator.
    generate: false
    idioms:
      describeOptions: null
      beforeEach:
        - 'cy.documentationScreenshotViewport()'
        - "cy.login(Cypress.env('username'), Cypress.env('password'))"
